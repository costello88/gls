name: Build Windows exe

on:
  push:
    branches:
      - claude/shopify-gls-automation-9db5j4
  workflow_dispatch: {}

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Run tests
        run: python -m pytest -q

      - name: Inject Shopify credentials into bundled defaults
        shell: bash
        env:
          SHOPIFY_SHOP_DOMAIN: ${{ secrets.SHOPIFY_SHOP_DOMAIN }}
          SHOPIFY_ACCESS_TOKEN: ${{ secrets.SHOPIFY_ACCESS_TOKEN }}
        run: |
          python - <<'EOF'
          import json
          import os

          path = "gls_sync/default_settings.json"
          with open(path) as f:
              data = json.load(f)
          data["shop_domain"] = os.environ.get("SHOPIFY_SHOP_DOMAIN", "")
          data["access_token"] = os.environ.get("SHOPIFY_ACCESS_TOKEN", "")
          with open(path, "w") as f:
              json.dump(data, f, indent=2)
          EOF

      - name: Build gls-sync.exe
        run: pyinstaller build.spec

      - uses: actions/upload-artifact@v4
        with:
          name: gls-sync-exe
          path: dist/gls-sync.exe
